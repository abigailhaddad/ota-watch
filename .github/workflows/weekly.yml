name: Weekly OTA Watch

# Every Monday: read FPDS for OT documents signed in the last 400 days, add the
# ones not seen before (data/documents.csv, first_seen = today), build the week's
# issue (data/issues/<date>.json; Claude picks, code checks), commit both, and
# deploy the site (https://ota-watch.abigailhaddad.com, Cloudflare Pages project
# ota-watch). One issue a week: the digest refuses to build one if the newest is
# under 6 days old, so a rerun or a late cron does nothing.
#
# Secrets: ANTHROPIC_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Variable: ANTHROPIC_WORKSPACE_ID (optional).
on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Collect FPDS OT documents
        run: uv run python -m ota_watch.collect
      - name: Build this week's issue
        run: uv run python -m ota_watch.digest
      - name: Commit data
        run: |
          git config user.name "ota-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "Weekly data $(date -u +%Y-%m-%d)"
          git push
      - name: Build site
        run: uv run python -m ota_watch.site --out site/dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.42.0"
          command: pages deploy site/dist --project-name=ota-watch --branch=main
