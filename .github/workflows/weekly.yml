name: OTA Watch

# Every day: read FPDS for OT documents signed in the last 400 days, add the
# ones not seen before (data/documents.csv, first_seen = now), commit, and update
# the Hugging Face dataset. Mondays only (or a manual run with digest: true):
# also build the week's issue (data/issues/<date>.json; Claude picks, code
# checks) -- the only step that calls Claude. The issue takes every document
# first seen since the previous issue's cutoff, so daily collection changes
# nothing about what's in it. Then deploy the site to the Cloudflare Pages project
# named by the CLOUDFLARE_PROJECT variable (default ota-watch). One issue a week: the
# digest refuses to build one if the newest is in the same Monday-Sunday week, so a
# rerun or a late cron does nothing.
#
# The Hugging Face dataset (OTA_HF_REPO, see ota_watch/config.py) is every OT document
# FPDS has, with documents.csv laid over it; see ota_watch/hf.py.
#
# Secrets: ANTHROPIC_API_KEY, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, HF_TOKEN.
# Variables (optional): ANTHROPIC_WORKSPACE_ID, CLOUDFLARE_PROJECT.
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      digest:
        description: "Build this week's issue (calls Claude) even if it isn't Monday"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
      - name: Collect FPDS OT documents
        run: uv run python -m ota_watch.collect
      - name: Build this week's issue (Mondays only; calls Claude)
        run: |
          if [ "${{ inputs.digest }}" != "true" ] && [ "$(date -u +%u)" != "1" ]; then
            echo "not Monday; no issue today"; exit 0
          fi
          uv run python -m ota_watch.digest
      - name: Commit data
        run: |
          git config user.name "ota-watch bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no data changes"; exit 0; fi
          git commit -m "Daily data $(date -u +%Y-%m-%d)"
          git push
      - name: Build site
        run: uv run python -m ota_watch.site --out site/dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.42.0"
          command: pages deploy site/dist --project-name=${{ vars.CLOUDFLARE_PROJECT || 'ota-watch' }} --branch=main
      - name: Update the Hugging Face dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_PROGRESS_BARS: "1"
        run: uv run python -m ota_watch.hf publish
