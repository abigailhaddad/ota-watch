[project]
name = "ota-watch"
version = "0.1.0"
description = "Weekly list of federal Other Transaction (OT) awards newly public in FPDS, with a few picked out by Claude"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
